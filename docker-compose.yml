services:
  mysql:
    image: mysql:8.4
    container_name: library-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: library
      MYSQL_USER: library
      MYSQL_PASSWORD: library_dev_password
      MYSQL_ROOT_PASSWORD: library_dev_root_password
    ports:
      - '3306:3306'
    volumes:
      - library-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  library-mysql-data:
